name: Tests

# Runs on every pull request, and is called by deploy-and-release.yml so a
# push to main cannot deploy until every suite passes.
on:
  pull_request:
  workflow_call:

env:
  NODE_VERSION: "22"  # Angular 22 needs Node 22.22.3 or later

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm install

      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions

      # Every test suite runs on the Firebase emulators. The Firestore emulator
      # needs Java 21 with this Firebase CLI version.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI for the emulators
        run: npm install -g firebase-tools@15.6.0

      - name: Type-check the MCP server
        run: npm --prefix functions run typecheck:mcp

      - name: Run browser tests
        run: npm run test:ci

      - name: Run site icon tests
        run: npm run test:site

      - name: Run security rules tests
        run: npm run test:rules

      - name: Run MAISIE tool tests
        run: npm run test:functions

      - name: Run MCP server tests
        run: npm run test:mcp
